<!doctype html>
<!-- Local dev preview of the popup with a stubbed chrome.* API and fake
     streaming search results. Not part of the extension; gitignored. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>BD Price Compare — preview</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand">
      <span class="logo">৳</span>
      <h1 id="appName">BD Price Compare</h1>
    </div>
    <div class="header-actions">
      <button id="langBtn" class="lang" title="বাংলায় দেখুন">বাং</button>
      <button id="openTab" title="Open in a full tab">⛶</button>
      <button id="openOptions" title="Settings">⚙</button>
    </div>
  </header>

  <nav class="tabs">
    <button id="tabSearch" class="tab active">Search</button>
    <button id="tabCart" class="tab">Cart <span id="cartBadge" class="cartbadge hidden">0</span></button>
    <button id="tabWatch" class="tab">⭐ <span id="watchLabel">Watch</span></button>
    <button id="tabBazar" class="tab">🧺 <span id="bazarLabel">Bazar</span></button>
  </nav>

  <section id="viewSearch">
    <div id="cats" class="cats"></div>
    <div class="searchbar">
      <input id="query" type="search" placeholder="Search a product…" autofocus>
      <button id="go">Compare</button>
    </div>

    <div id="detect" class="detect"></div>
    <div id="recent" class="recent"></div>
    <div id="chips" class="chips"></div>
    <div id="best" class="best hidden"></div>

    <div class="controls hidden" id="controls">
      <label><span id="sortLabel">Sort</span>
        <select id="sort">
          <option value="unit">Best unit price</option>
          <option value="price">Lowest price</option>
          <option value="store">By store</option>
        </select>
      </label>
      <label class="check">
        <input type="checkbox" id="strict" checked>
        <span id="strictLabel">Close matches only</span>
      </label>
    </div>

    <main id="results"></main>
  </section>

  <section id="viewCart" class="hidden"><main id="cartList"></main></section>
  <section id="viewWatch" class="hidden"><main id="watchList"></main></section>
  <section id="viewBazar" class="hidden"><main id="bazarList"></main></section>

  <footer><span id="status"></span></footer>

  <script type="module">
    import { enrich } from './lib/normalize.js';

    const FAKE_STORES = [
      { id: 'shwapno', label: 'Shwapno', color: '#e2136e', category: 'grocery', enabled: true },
      { id: 'meenabazar', label: 'Meena Bazar', color: '#00843d', category: 'grocery', enabled: true },
      { id: 'pandamart', label: 'Pandamart', color: '#d70f64', category: 'grocery', enabled: true },
      { id: 'daraz', label: 'Daraz', color: '#f57224', category: 'both', enabled: true },
      { id: 'startech', label: 'Star Tech', color: '#ef4a23', category: 'electronics', enabled: true }
    ];

    const mk = (store, label, color, items, delay, ok = true) => ({
      delay,
      result: {
        store, label, color, ok, searchUrl: '#', ms: delay,
        error: ok ? undefined : 'bot wall — try on the site',
        items: items.map(i => enrich({ ...i, store }))
      }
    });

    const IMG = 'icons/icon128.png';
    const FEED = [
      mk('shwapno', 'Shwapno', '#e2136e', [
        { name: 'Himalaya Anti Hair Fall Shampoo 180(±)10ml (Buy1 Get1 Free)', price: 270, url: '#', image: IMG },
        { name: 'Himalaya Gentle Daily Care Shampoo 400ml', price: 520, url: '#', image: IMG }
      ], 400),
      mk('meenabazar', 'Meena Bazar', '#00843d', [
        { name: 'HIMALAYA ANTI HAIR FALL SHAMPOO 180ML B1G1', price: 270, url: '#', image: IMG,
          hist: { lo: 270, hi: 285, n: 9, lowest: true } },
        { name: 'Himalaya Anti Hair Fall Shampoo Cc 375ml Save40%', price: 288, oldPrice: 480, url: '#', image: IMG,
          hist: { lo: 265, hi: 295, n: 12, claim: 'fake' } }
      ], 900),
      mk('daraz', 'Daraz', '#f57224', [
        { name: 'Himalaya Anti Hair Fall Shampoo 340ml', price: 465, url: '#', image: IMG, rating: 4.7, reviews: 211 }
      ], 1600),
      mk('pandamart', 'Pandamart', '#d70f64', [
        { name: 'Parachute Naturale Shampoo Anti Hair Fall 320ml', price: 265, url: '#', image: IMG }
      ], 3200)
    ];

    function fakePort() {
      const listeners = [];
      const port = {
        onMessage: { addListener: f => listeners.push(f) },
        onDisconnect: { addListener() {} },
        disconnect() {},
        postMessage(msg) {
          if (msg.type !== 'SEARCH') return;
          const emit = ev => listeners.forEach(f => f(ev));
          setTimeout(() => emit({ type: 'plan', stores: FEED.map(f => f.result.store).concat('startech') }), 60);
          for (const f of FEED) setTimeout(() => emit({ type: 'store', result: f.result }), f.delay);
          setTimeout(() => emit({ type: 'skip', stores: ['startech'], detected: 'grocery' }), 1100);
          setTimeout(() => emit({
            type: 'done',
            data: { query: msg.query, category: msg.category, detectedCategory: 'grocery', at: Date.now(), results: FEED.map(f => f.result) }
          }), 3400);
        }
      };
      return port;
    }

    const mem = {};
    window.chrome = {
      storage: {
        sync: { get: async () => ({}), set: async () => {} },
        local: {
          get: async k => {
            const keys = typeof k === 'string' ? [k] : Array.isArray(k) ? k : Object.keys(k || mem);
            return Object.fromEntries(keys.filter(x => x in mem).map(x => [x, mem[x]]));
          },
          set: async o => Object.assign(mem, o),
          remove: async () => {}
        },
        onChanged: { addListener() {} }
      },
      runtime: {
        sendMessage: async msg => {
          if (msg.type === 'GET_STORES') return { stores: FAKE_STORES, settings: { searchCategory: 'grocery' } };
          return { ok: true };
        },
        connect: fakePort,
        onMessage: { addListener() {} },
        openOptionsPage() {},
        getURL: p => p
      },
      tabs: { query: async () => [], create() {} },
      scripting: { executeScript: async () => [{ result: null }] }
    };
    mem.recentSearches = ['himalaya shampoo 180ml', 'surf excel 1kg', 'fresh milk 1l'];

    // fake 7-day bazar history
    const days = [...Array(7)].map((_, i) => new Date(Date.now() - (6 - i) * 864e5).toISOString().slice(0, 10));
    const hist = (store, base, deltas, extra) => days.map((d, i) => ({
      d, p: Math.round((base + deltas[i]) * (extra.mult || 1)), u: base + deltas[i],
      l: extra.l, n: extra.n, q: extra.q, url: '#'
    }));
    mem.bazarHistory = {
      rice:   { shwapno: hist('shwapno', 90, [0, 0, 1, 2, 2, 1, 0], { l: 'kg', n: 'Rupchanda Miniket Rice 10kg', q: '10kg', mult: 10 }) },
      oil:    { shwapno: hist('shwapno', 200, [4, 4, 2, 0, 0, -2, -2], { l: 'L', n: 'Pusti Soyabean Oil 5Ltr.', q: '5Ltr', mult: 5 }),
                meenabazar: hist('meenabazar', 199, [5, 5, 3, 1, 0, 0, 0], { l: 'L', n: 'Rupchanda Soyabean Oil Pet 5lt', q: '5lt', mult: 5 }) },
      onion:  { shwapno: hist('shwapno', 50, [-5, -5, 0, 0, 5, 8, 10], { l: 'kg', n: 'Piyaj (Onion) Local Loose (P) Kg', q: '1kg' }) },
      potato: { shwapno: hist('shwapno', 25, [0, 0, 0, -2, -2, -3, -3], { l: 'kg', n: 'Alu (Potato) Regular Loose Kg', q: '1kg' }) },
      egg:    { meenabazar: hist('meenabazar', 12.5, [0, 0, .5, .5, 0, 0, -0.5], { l: 'pc', n: 'Chicken Egg (Red) 1pcs', q: '1 pcs' }) },
      sugar:  { shwapno: hist('shwapno', 110, [0, 0, 0, 0, 0, 0, 0], { l: 'kg', n: 'Fresh Refined Sugar 1kg', q: '1kg' }) }
    };
    mem.bazarLast = { at: Date.now() - 3600e3, date: days[6] };

    await import('./popup.js');
    document.getElementById('query').value = 'Himalaya Anti Hair Fall Shampoo 180ml B1G1';
  </script>
</body>
</html>
